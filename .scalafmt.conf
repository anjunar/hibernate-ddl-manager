version = "3.11.5"
runner.dialect = scala3
maxColumn = 120
indent.main = 2
indent.callSite = 2
indent.defnSite = 2
newlines.source = keep
binPack.importSelectors = singleLine
docstrings.style = keep
rewrite.rules = []

project.git = true
project.includePaths = ["glob:**.scala", "glob:**.sbt"]
project.excludePaths = ["glob:**/target/**", "glob:**/node_modules/**"]
